spring.application.name=consumidor
server.port=8082

# Virtual threads: cada requisição esperando a rede não segura uma thread do SO.
# Troque para false para comparar com o modelo tradicional (pool de 200 threads).
spring.threads.virtual.enabled=true

# Onde está o buffer
consumidor.buffer.url=http://localhost:8080
# Buffer vazio: quanto tempo esperar antes de perguntar de novo
consumidor.espera-ms=100
# Buffer vazio por mais que isso: desiste e devolve o que conseguiu fazer
consumidor.desistir-apos-ms=30000

# Mostra a mensagem de erro no JSON de resposta (400, 502...)
spring.web.error.include-message=always
management.endpoints.web.exposure.include=health,metrics
