spring.application.name=produtor
server.port=8081

# Virtual threads: cada requisição esperando a rede não segura uma thread do SO.
# Troque para false para comparar com o modelo tradicional (pool de 200 threads).
spring.threads.virtual.enabled=true

# Onde está o buffer
produtor.buffer.url=http://localhost:8080
# Tamanho de cada job, em KB. É o que faz a rede e o disco do buffer pesarem.
produtor.job-kb=100
# Buffer cheio: quanto tempo esperar antes de perguntar de novo
produtor.espera-ms=100
# Buffer cheio por mais que isso: desiste e devolve o que conseguiu fazer
produtor.desistir-apos-ms=30000

# Mostra a mensagem de erro no JSON de resposta (400, 502...)
spring.web.error.include-message=always
management.endpoints.web.exposure.include=health,metrics
