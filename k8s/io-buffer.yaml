apiVersion: apps/v1
kind: Deployment
metadata:
  name: buffer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: buffer
  template:
    metadata:
      labels:
        app: buffer
    spec:
      containers:
        - name: buffer
          image: wendelltmo/poi-io-bound:1.0
          imagePullPolicy: IfNotPresent
          args: ["java", "-jar", "buffer-0.1.0.jar", "--buffer.dir=/data"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - { name: jobs, mountPath: /data }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: jobs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: buffer
spec:
  type: ClusterIP
  selector:
    app: buffer
  ports:
    - port: 8080
      targetPort: 8080
