apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumidor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumidor
  template:
    metadata:
      labels:
        app: consumidor
    spec:
      containers:
        - name: consumidor
          image: wendelltmo/poi-io-bound:1.0
          imagePullPolicy: IfNotPresent
          args: ["java", "-jar", "consumidor-0.1.0.jar"]
          env:
            - { name: CONSUMIDOR_BUFFER_URL, value: "http://buffer:8080" }
          ports:
            - containerPort: 8082
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8082 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8082 }
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: consumidor
spec:
  type: NodePort
  selector:
    app: consumidor
  ports:
    - port: 8082
      targetPort: 8082
      nodePort: 31304
