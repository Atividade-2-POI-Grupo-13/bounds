apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-bound
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory-bound
  template:
    metadata:
      labels:
        app: memory-bound
    spec:
      containers:
        - name: memory-bound
          image: wendelltmo/poi-memory-bound:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - { name: PERMITIR_REINICIO, value: "0" }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: memory-bound
spec:
  type: NodePort
  selector:
    app: memory-bound
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 31302
