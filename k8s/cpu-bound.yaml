apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-bound
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cpu-bound
  template:
    metadata:
      labels:
        app: cpu-bound
    spec:
      containers:
        - name: cpu-bound
          image: wendelltmo/poi-cpu-bound:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cpu-bound
spec:
  type: NodePort
  selector:
    app: cpu-bound
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 31301
