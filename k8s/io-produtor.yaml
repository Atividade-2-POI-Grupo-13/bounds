apiVersion: apps/v1
kind: Deployment
metadata:
  name: produtor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: produtor
  template:
    metadata:
      labels:
        app: produtor
    spec:
      containers:
        - name: produtor
          image: wendelltmo/poi-io-bound:1.0
          imagePullPolicy: IfNotPresent
          args: ["java", "-jar", "produtor-0.1.0.jar"]
          env:
            - { name: PRODUTOR_BUFFER_URL, value: "http://buffer:8080" }
          ports:
            - containerPort: 8081
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: produtor
spec:
  type: NodePort
  selector:
    app: produtor
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 31303
