spring.application.name=buffer
server.port=8080

# Virtual threads: cada requisição esperando o disco não segura uma thread do SO.
# Troque para false para comparar com o modelo tradicional (pool de 200 threads).
spring.threads.virtual.enabled=true

# Quantos jobs cabem no buffer
buffer.capacidade=10
# Pasta onde cada job vira um arquivo (é esvaziada quando o buffer sobe)
buffer.dir=data
# true = força a gravação em disco a cada job (durável e lento)
# false = deixa o sistema operacional decidir (rápido)
buffer.fsync=true

management.endpoints.web.exposure.include=health,metrics
